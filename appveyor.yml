image:
  - Visual Studio 2022
  - Ubuntu2404
  - macos-sonoma

# Disable automatic MSBuild; npm run check still builds the package.
build: off

# Default setup runs in Bash on both POSIX images.
install:
  - sh: |
      set -e
      command -v python3 >/dev/null || { echo 'Missing prerequisite: python3' >&2; exit 1; }
      python3 --version
      if ! command -v nvm >/dev/null; then
        export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
        test -s "$NVM_DIR/nvm.sh" || { echo 'Missing prerequisite: nvm.sh' >&2; exit 1; }
        . "$NVM_DIR/nvm.sh"
      fi
      nvm install 22
      nvm use 22
      for tool in node npm; do
        command -v "$tool" >/dev/null || { echo "Missing prerequisite: $tool" >&2; exit 1; }
      done

# ps: alone is cross-platform. Specialize the entire install phase for Windows.
for:
  - matrix:
      only:
        - image: Visual Studio 2022
    install:
      - ps: |
          $ErrorActionPreference = 'Stop'
          Get-Command Install-Product -ErrorAction Stop | Out-Null
          $global:LASTEXITCODE = 0
          Install-Product node 22 x64
          if ($LASTEXITCODE -ne 0) { throw "Install-Product failed: $LASTEXITCODE" }
          Get-Command node, npm -ErrorAction Stop | Out-Null

# Unprefixed entries use native CMD/Bash; each failure stops the job.
test_script:
  - >-
      node -e "const a=require('node:assert/strict');const i=process.env.APPVEYOR_BUILD_WORKER_IMAGE;
      const p={'Visual Studio 2022':'win32',Ubuntu2404:'linux','macos-sonoma':'darwin'};
      a.ok(Object.hasOwn(p,i),'Unexpected AppVeyor image');
      a.equal(process.platform,p[i],'Image/platform mismatch');
      a.equal(process.versions.node.split('.')[0],'22','Node major must be 22');
      if(process.platform==='win32')a.equal(process.arch,'x64','Windows Node must be x64');
      console.log({image:i,node:process.version,platform:process.platform,arch:process.arch});"
  - npm ci
  - npm run check
  - npm run smoke
  - npm pack --dry-run
