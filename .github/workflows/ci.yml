name: native-rustdoc-capture
run-name: native-rustdoc-capture ${{ inputs.candidate_sha }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact native capture candidate SHA (40 lowercase hexadecimal characters)
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-rustdoc-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Official checkout v4.2.2, upstream tag verified in prior authorized capture.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify exact candidate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CI_PROVENANCE_PATH: ${{ runner.temp }}/ci-candidate.json
        run: node scripts/ci-candidate.mjs
      - name: Capture native Rustdoc supplement
        env:
          RUSTUP_HOME: ${{ runner.temp }}/c05-rustup
          CARGO_HOME: ${{ runner.temp }}/c05-cargo
          RUSTUP_TOOLCHAIN: nightly-2026-10-08
          CAPTURE_OUTPUT: ${{ runner.temp }}/native-rustdoc
          CI_PROVENANCE_PATH: ${{ runner.temp }}/ci-candidate.json
        run: python3 fixtures/profiles/cargo-doc/actions-20261009/capture.py
      - name: Upload all native evidence even on failure
        if: always()
        # Official upload-artifact v4.6.2.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-rustdoc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-rustdoc
            ${{ runner.temp }}/ci-candidate.json
          if-no-files-found: error
