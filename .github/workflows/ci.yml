name: native-cargo-bench-capture
run-name: native-cargo-bench-capture ${{ inputs.candidate_sha }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact capture candidate commit (40 lowercase hexadecimal characters)
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-cargo-bench-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_HOME: ${{ runner.temp }}/capture-rustup
      CARGO_HOME: ${{ runner.temp }}/capture-cargo
      RUSTUP_TOOLCHAIN: nightly-2026-10-08
      CAPTURE_OUTPUT: ${{ runner.temp }}/native-cargo-bench
      CI_PROVENANCE_PATH: ${{ runner.temp }}/ci-candidate.json
    steps:
      # Official v4.2.2: https://github.com/actions/checkout/releases/tag/v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify exact candidate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/ci-candidate.mjs
      - name: Capture native builtin benchmarks
        run: python3 fixtures/profiles/cargo-bench/capture.py
      - name: Upload raw capture and provenance even on failure
        if: always()
        # Official v4.6.2: https://github.com/actions/upload-artifact/releases/tag/v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cargo-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-cargo-bench
            ${{ runner.temp }}/ci-candidate.json
          if-no-files-found: error
