name: verify
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit (40 lowercase hexadecimal characters)
        required: true
        type: string
concurrency:
  group: verify-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - name: Verify candidate identity and record provenance
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CI_PROVENANCE_PATH: ${{ runner.temp }}/ci-candidate-${{ matrix.os }}.json
        run: node scripts/ci-candidate.mjs
      - run: npm ci
      - run: npm run structure
      - run: npm run typecheck
      - name: Test with bounded file concurrency
        run: node --import tsx --test --test-concurrency=2 tests/*.test.ts
      - run: npm run build
      - run: npm run smoke
      - run: npm pack --dry-run
      - name: Probe snapshot preservation and restore exact source
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const file = 'src/core/profile-selection.ts', original = readFileSync(file);
          const text = original.toString(), mutant = text.replace('Object.freeze({ id, match, reduce })', '({ id, match, reduce })');
          assert.notEqual(mutant, text, 'snapshot mutation did not engage');
          const run = () => spawnSync(process.execPath, ['--import', 'tsx', '--test', 'tests/profile-selection.test.ts'], { encoding: 'utf8', timeout: 60000 });
          try {
            writeFileSync(file, mutant);
            const red = run();
            process.stdout.write(red.stdout ?? ''); process.stderr.write(red.stderr ?? '');
            assert.equal(red.error, undefined); assert.equal(red.signal, null);
            assert.equal(red.status, 1, 'mutable snapshot escaped preservation test');
            assert.match(red.stdout, /not ok.*public snapshots/);
          } finally { writeFileSync(file, original); }
          assert.deepEqual(readFileSync(file), original, 'source restoration differs');
          const green = run();
          process.stdout.write(green.stdout ?? ''); process.stderr.write(green.stderr ?? '');
          assert.equal(green.error, undefined); assert.equal(green.status, 0, 'restored focused suite failed');
          NODE
      - name: Pack actual candidate and verify installed public APIs
        if: matrix.os == 'ubuntu-latest'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/lean-package
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          IDENTITY_PATH: ${{ runner.temp }}/ci-candidate-${{ matrix.os }}.json
        run: |
          mkdir "$ARTIFACT_DIR"
          npm pack --ignore-scripts --json --pack-destination "$ARTIFACT_DIR" > "$ARTIFACT_DIR/pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync, cpSync, mkdirSync } from 'node:fs';
          import path from 'node:path';
          const dir = process.env.ARTIFACT_DIR;
          const { assertPack } = await import('./scripts/package-smoke.mjs');
          const pack = JSON.parse(readFileSync(path.join(dir, 'pack.json'), 'utf8'));
          const entry = assertPack(pack), archive = readFileSync(path.join(dir, entry.filename));
          const consumer = path.join(dir, 'consumer'); mkdirSync(consumer);
          execFileSync('npm', ['install', path.join(dir, entry.filename), '--ignore-scripts', '--no-audit', '--no-fund', '--package-lock=false'], { cwd: consumer, stdio: 'inherit' });
          const { PACKAGE_API_INSPECT } = await import('./scripts/package-api.mjs');
          execFileSync(process.execPath, ['--input-type=module', '-e', PACKAGE_API_INSPECT], { cwd: consumer, stdio: 'inherit' });
          const materials = entry.files.filter(file => file === 'LICENSE' || file === 'NOTICE' || file.startsWith('licenses/') || file.endsWith('/SOURCES.md'));
          const expectedNotes = execFileSync('git', ['ls-files', 'fixtures'], { encoding: 'utf8' }).trim().split('\n').filter(file => file.endsWith('/SOURCES.md'));
          for (const file of ['LICENSE', 'NOTICE', 'licenses/TRS-MIT.txt', ...expectedNotes])
            assert.ok(materials.includes(file), 'packed material missing: ' + file);
          assert.ok(expectedNotes.some(file => file.startsWith('fixtures/automatic/')));
          for (const file of materials) {
            const original = readFileSync(file), installed = readFileSync(path.join(consumer, 'node_modules/hugr-lean', file));
            assert.ok(original.length > 0); assert.deepEqual(installed, original);
            const target = path.join(dir, 'licenseRoot', file);
            mkdirSync(path.dirname(target), { recursive: true }); cpSync(file, target);
          }
          assert.equal(pack[0].integrity, 'sha512-' + createHash('sha512').update(archive).digest('base64'));
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), process.env.CANDIDATE_SHA);
          const digest = algorithm => createHash(algorithm).update(archive).digest('hex');
          writeFileSync(path.join(dir, 'package-provenance.json'), JSON.stringify({ source: process.env.CANDIDATE_SHA,
            tree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            run: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            repository: process.env.GITHUB_REPOSITORY, version: pack[0].version, filename: entry.filename, bytes: archive.length,
            sha256: digest('sha256'), sha512: digest('sha512'), integrity: pack[0].integrity,
            materials: materials.map(file => ({ path: file, sha256: createHash('sha256').update(readFileSync(file)).digest('hex') })) }, null, 2) + '\n');
          cpSync(process.env.IDENTITY_PATH, path.join(dir, 'candidate-identity.json'));
          NODE
      - name: Upload actual candidate package and complete license provenance
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lean-package-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/lean-package/*.tgz
            ${{ runner.temp }}/lean-package/*.json
            ${{ runner.temp }}/lean-package/licenseRoot
          if-no-files-found: error
      - name: Upload candidate identity provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-candidate-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-candidate-${{ matrix.os }}.json
          if-no-files-found: error
