name: verify
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit (40 lowercase hexadecimal characters)
        required: true
        type: string
concurrency:
  group: verify-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - name: Verify candidate identity and record provenance
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CI_PROVENANCE_PATH: ${{ runner.temp }}/ci-candidate-${{ matrix.os }}.json
        run: node scripts/ci-candidate.mjs
      - run: npm ci
      - run: npm run structure
      - run: npm run typecheck
      - name: Test with bounded file concurrency
        run: node --import tsx --test --test-concurrency=2 tests/*.test.ts
      - run: npm run build
      - run: npm run smoke
      - run: npm pack --dry-run
      - name: Upload candidate identity provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-candidate-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-candidate-${{ matrix.os }}.json
          if-no-files-found: error
