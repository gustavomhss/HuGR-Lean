name: release
# Publishes an existing vX.Y.Z tag: three-OS check, npm publish with provenance, GitHub release.
# Requires repository secret NPM_TOKEN (npm automation or granular token with publish rights).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.4.0
        required: true
        type: string
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  check:
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17.1
          cache: npm
      - name: Tag matches package.json version and CHANGELOG
        run: node scripts/release-tag.mjs "$RELEASE_TAG"
      - run: npm ci
      - run: npm run structure
      - run: npm run typecheck
      - name: Test with bounded file concurrency
        run: node --import tsx --test --test-concurrency=2 tests/*.test.ts
      - run: npm run build
      - run: npm run smoke
      - run: npm pack --dry-run

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=NPM_TOKEN missing::Add an npm publish token as repository secret NPM_TOKEN (Settings > Secrets and variables > Actions), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version and CHANGELOG; version not yet on npm
        id: meta
        run: |
          node scripts/release-tag.mjs "$RELEASE_TAG" --notes "$RUNNER_TEMP/notes.md"
          version="${RELEASE_TAG#v}"
          if npm view "hugr-lean@$version" version >/dev/null 2>&1; then
            echo "::error::hugr-lean@$version is already on npm; bump the version instead of re-publishing."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Pack and checksum
        run: |
          npm pack
          artifact="hugr-lean-${{ steps.meta.outputs.version }}.tgz"
          sha256sum "$artifact" > "$artifact.sha256"
          cat "$artifact.sha256"
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./hugr-lean-${{ steps.meta.outputs.version }}.tgz" --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="hugr-lean-${{ steps.meta.outputs.version }}.tgz"
          gh release create "$RELEASE_TAG" "$artifact" "$artifact.sha256" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "HuGR-Lean ${{ steps.meta.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md" --latest
